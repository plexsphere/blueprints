#
# Example composite for `crossplane render` of the
# kubernetes-cloudless-node blueprint. Used by CI only. The composite is
# Namespaced, so it carries a namespace mimicking the broker's
# per-Project management-fleet namespace (plexsphere-project-<id>).
apiVersion: blueprints.plexsphere.com/v1alpha1
kind: XKubernetesCloudlessNode
metadata:
  name: example-kubernetes-cloudless-node
  namespace: plexsphere-project-example
spec:
  parameters:
    helmValues:
      bootstrapToken: example-bootstrap-token
  cloudTags:
    plexsphere:example: "true"
