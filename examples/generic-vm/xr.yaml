#
# Example composite for `crossplane render` of the generic-vm
# blueprint. Used by CI only.
apiVersion: blueprints.plexsphere.com/v1alpha1
kind: XGenericVM
metadata:
  name: example-generic-vm
  namespace: plexsphere-project-example
spec:
  parameters:
    region: eu-central-1
    instanceType: standard-2
    diskSizeGb: 40
  userData: "#cloud-config\n"
  cloudTags:
    plexsphere:example: "true"
