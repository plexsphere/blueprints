#
# CompositeResourceDefinition for the generic VM blueprint.
# Provider-agnostic: a single VM bootstrapped through cloud-init
# user-data, targetable at any of the supported provider substrates.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xgenericvms.blueprints.plexsphere.com
spec:
  group: blueprints.plexsphere.com
  names:
    kind: XGenericVM
    plural: xgenericvms
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                region:
                  type: string
                  description: Provider region the VM is placed in.
                instanceType:
                  type: string
                  description: Provider-specific machine size identifier.
                userData:
                  type: string
                  description: cloud-init user-data injected at first boot.
                cloudTags:
                  type: object
                  description: Propagation-resolved cloud-provider tags stamped by the broker at render time.
                  additionalProperties:
                    type: string
              required:
                - region
