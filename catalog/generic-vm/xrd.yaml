#
# CompositeResourceDefinition for the generic VM blueprint.
# Provider-agnostic: a single VM bootstrapped through cloud-init
# user-data, targetable at any of the supported provider substrates.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xgenericvms.blueprints.plexsphere.com
spec:
  # Crossplane v2 requires an explicit scope; the broker renders the XR
  # into the per-Project management-fleet namespace, so it is Namespaced.
  # The provider-neutral VirtualMachine base is an in-repo abstraction with
  # no cluster-scoped provider MR, so Namespaced is the consistent choice.
  scope: Namespaced
  group: blueprints.plexsphere.com
  names:
    kind: XGenericVM
    plural: xgenericvms
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                parameters:
                  type: object
                  description: Free-form blueprint request parameters preserved verbatim for the composition to consume.
                  x-kubernetes-preserve-unknown-fields: true
                userData:
                  type: string
                  description: cloud-init user-data injected at first boot.
                cloudTags:
                  type: object
                  description: Propagation-resolved cloud-provider tags stamped by the broker at render time.
                  additionalProperties:
                    type: string
