#
# Example composite for `crossplane render` of the aws-ec2-instance
# blueprint. Not part of the published bundle; used by CI only.
apiVersion: blueprints.plexsphere.com/v1alpha1
kind: XAWSEC2Instance
metadata:
  name: example-aws-ec2-instance
  namespace: plexsphere-project-example
spec:
  parameters:
    region: eu-central-1
    instanceType: t3.micro
    monitoring: false
  userData: "#cloud-config\n"
  cloudTags:
    plexsphere:example: "true"
