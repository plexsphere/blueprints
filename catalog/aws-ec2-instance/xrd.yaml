#
# CompositeResourceDefinition for the AWS EC2 instance blueprint. A
# single EC2 instance whose request parameters are threaded in through a
# provider Secret rather than cloud-init user-data.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xawsec2instances.blueprints.plexsphere.com
spec:
  group: blueprints.plexsphere.com
  names:
    kind: XAWSEC2Instance
    plural: xawsec2instances
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                region:
                  type: string
                  description: AWS region the EC2 instance is launched in.
                instanceType:
                  type: string
                  description: EC2 instance type identifier.
                amiId:
                  type: string
                  description: AMI image identifier for the instance.
                cloudTags:
                  type: object
                  description: Propagation-resolved cloud-provider tags stamped by the broker at render time.
                  additionalProperties:
                    type: string
              required:
                - region
                - instanceType
