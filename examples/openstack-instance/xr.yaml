#
# Example composite for `crossplane render` of the openstack-instance
# blueprint. Not part of the published bundle; used by CI only. The
# composite is Namespaced, so it carries a namespace mimicking the
# broker's per-Project management-fleet namespace (plexsphere-project-<id>).
apiVersion: blueprints.plexsphere.com/v1alpha2
kind: XOpenStackInstance
metadata:
  name: example-openstack-instance
  namespace: plexsphere-project-example
spec:
  parameters:
    imageName: ubuntu-24.04
    flavorName: m1.small
    networkName: lab
  userData: "#cloud-config\n"
  cloudTags:
    plexsphere:example: "true"
