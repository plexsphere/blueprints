#
# CompositeResourceDefinition for the Hetzner Cloud server blueprint.
# A single Hetzner Cloud server bootstrapped through cloud-init
# user-data.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xhetznerservers.blueprints.plexsphere.com
spec:
  group: blueprints.plexsphere.com
  names:
    kind: XHetznerServer
    plural: xhetznerservers
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                parameters:
                  type: object
                  description: Free-form blueprint request parameters preserved verbatim for the composition to consume.
                  x-kubernetes-preserve-unknown-fields: true
                userData:
                  type: string
                  description: cloud-init user-data injected at first boot.
                cloudTags:
                  type: object
                  description: Propagation-resolved cloud-provider tags stamped by the broker at render time.
                  additionalProperties:
                    type: string
