#
# Release: on a semver tag, validate, build the OCI bundle, push it to
# GHCR, and sign it keyless with cosign (Sigstore: Fulcio code-signing
# certificate + Rekor inclusion proof). The signed bundle is what
# plexsphere pins and verifies (plexsphere#293).
name: release

on:
  push:
    tags: ["v*"]

# Every move of the `v1` tag starts a run on the same ref, and each run
# pushes and signs by that tag. Queue runs per ref, never cancelling one
# mid-push, so the last move publishes last and signs its own digest.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write   # push the OCI artifact to GHCR
  id-token: write   # cosign keyless OIDC (Fulcio)

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    # Runs on a ref are serialized (see concurrency), so a stalled push must
    # not hold the queue for GitHub's 6h default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: oras-project/setup-oras@v1
      - uses: sigstore/cosign-installer@v3
        with:
          # `cosign sign --new-bundle-format` (OCI artifact signing) landed in
          # cosign v2.6.0 (sigstore/cosign#4316); earlier releases only support
          # the flag on the *-blob subcommands. Pin a >= 2.6 release so the
          # requirement is explicit. Staying on 2.6.x (rather than 3.x) keeps
          # tag-based `sha256-<digest>.sig` triangulation and the Rekor v1
          # keyless flow the plexsphere importer pins, unchanged.
          cosign-release: v2.6.3

      - name: Validate before publishing
        run: |
          pip install --quiet pyyaml
          python3 scripts/validate.py

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to publish a superseded tag position
        # The concurrency group orders runs by start time, not by where the
        # tag points. A re-run of an older run would push its commit's bundle
        # over the one a newer move already published, so stop when the tag
        # no longer points at this run's commit. A re-run also takes the
        # queue's pending slot and cancels a newer pending run, so the error
        # names the commit whose run needs re-running.
        run: |
          git fetch --no-tags --depth=1 origin "+refs/tags/${GITHUB_REF_NAME}:refs/tmp/current"
          CURRENT="$(git rev-parse 'refs/tmp/current^{commit}')"
          OURS="$(git rev-parse HEAD)"
          if [ "${CURRENT}" != "${OURS}" ]; then
            echo "::error::${GITHUB_REF_NAME} now points at ${CURRENT}, not ${OURS}; refusing a stale publish"
            {
              echo "### Stale release run refused"
              echo "${GITHUB_REF_NAME} now points at \`${CURRENT}\`. If the run for that commit shows as"
              echo "cancelled, re-run it so the bundle under ${GITHUB_REF_NAME} matches the tag."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Build and push bundle
        run: scripts/build-bundle.sh "${IMAGE}:${GITHUB_REF_NAME}"

      - name: Resolve pushed digest
        id: digest
        run: |
          DIGEST="$(oras manifest fetch --descriptor "${IMAGE}:${GITHUB_REF_NAME}" | jq -r .digest)"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Published ${IMAGE}:${GITHUB_REF_NAME} @ ${DIGEST}"

      - name: Sign bundle (cosign keyless)
        # --new-bundle-format attaches the signature as a
        # application/vnd.dev.sigstore.bundle.v0.3+json layer at the
        # sha256-<digest>.sig triangulation tag — the self-contained Sigstore
        # bundle (Fulcio cert + Rekor inclusion proof inline) the plexsphere
        # blueprint importer selects by media type. Without it cosign emits the
        # legacy simple-signing format and import fails verification.
        run: cosign sign --yes --new-bundle-format "${IMAGE}@${{ steps.digest.outputs.digest }}"
