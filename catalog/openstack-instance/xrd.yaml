#
# CompositeResourceDefinition for the OpenStack instance blueprint.
# A single OpenStack Nova compute instance bootstrapped through
# cloud-init user-data.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xopenstackinstances.blueprints.plexsphere.com
spec:
  group: blueprints.plexsphere.com
  names:
    kind: XOpenStackInstance
    plural: xopenstackinstances
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                availabilityZone:
                  type: string
                  description: OpenStack Nova availability zone.
                flavorName:
                  type: string
                  description: OpenStack Nova flavor identifier.
                userData:
                  type: string
                  description: cloud-init user-data injected at first boot.
                cloudTags:
                  type: object
                  description: Propagation-resolved cloud-provider tags stamped by the broker at render time.
                  additionalProperties:
                    type: string
              required:
                - availabilityZone
                - flavorName
