#
# CompositeResourceDefinition for the OpenStack instance blueprint: one
# OpenStack Nova server that boots the plexsphere broker's cloud-init
# document and registers as a plexsphere node.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xopenstackinstances.blueprints.plexsphere.com
spec:
  # The broker renders the composite into the Project namespace, and a
  # namespaced composite composes only namespaced managed resources.
  scope: Namespaced
  group: blueprints.plexsphere.com
  names:
    kind: XOpenStackInstance
    plural: xopenstackinstances
  versions:
    - name: v1alpha2
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                parameters:
                  type: object
                  description: Free-form blueprint request parameters preserved verbatim for the composition to consume.
                  x-kubernetes-preserve-unknown-fields: true
                userData:
                  type: string
                  description: cloud-init user-data injected at first boot.
                cloudTags:
                  type: object
                  description: Propagation-resolved cloud-provider tags stamped by the broker at render time.
                  additionalProperties:
                    type: string
