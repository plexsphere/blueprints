#
# CompositeResourceDefinition for the AWS EKS cluster blueprint with a
# bundled DaemonSet. Request parameters are threaded into the rendered
# resources through Helm chart values.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xawseksclusterdaemonsets.blueprints.plexsphere.com
spec:
  # Crossplane v2 requires an explicit scope; the broker renders the XR
  # into the per-Project management-fleet namespace, so it is Namespaced.
  # A Namespaced composite may compose only namespaced managed resources,
  # which is why the composition base is the eks.aws.m.upbound.io variant.
  scope: Namespaced
  group: blueprints.plexsphere.com
  names:
    kind: XAWSEKSClusterDaemonSet
    plural: xawseksclusterdaemonsets
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                parameters:
                  type: object
                  description: Free-form blueprint request parameters preserved verbatim for the composition to consume.
                  x-kubernetes-preserve-unknown-fields: true
                cloudTags:
                  type: object
                  description: Propagation-resolved cloud-provider tags stamped by the broker at render time.
                  additionalProperties:
                    type: string
