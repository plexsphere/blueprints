#
# Pull-request / push gate: lint + structural validation + crossplane
# render + a build dry-run. Mirrors the checks the consuming
# BlueprintSource enforces (plexsphere#293) so a green PR here means the
# bundle will be accepted downstream.
name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install tooling
        run: pip install --quiet pyyaml yamllint
      - name: yamllint
        run: yamllint -c .yamllint.yml catalog/ examples/ .yamllint.yml
      - name: Structural validation (mirrors manifest.ValidatePair)
        run: python3 scripts/validate.py

  build-dry-run:
    runs-on: ubuntu-latest
    needs: lint-and-validate
    steps:
      - uses: actions/checkout@v4
      - uses: oras-project/setup-oras@v1
      - name: Assemble bundle into a local OCI layout (no push)
        run: scripts/build-bundle.sh --dry-run ghcr.io/plexsphere/blueprints:dry-run
      - name: Show assembled manifest
        run: oras manifest fetch --oci-layout _bundle:dry-run | python3 -m json.tool

  render:
    runs-on: ubuntu-latest
    needs: lint-and-validate
    steps:
      - uses: actions/checkout@v4
      - name: Install crossplane CLI
        run: |
          curl -sL https://raw.githubusercontent.com/crossplane/crossplane/main/install.sh | sh
          sudo mv crossplane /usr/local/bin/
          crossplane version --client
      - name: crossplane render each blueprint
        run: |
          set -euo pipefail
          for d in catalog/*/; do
            slug="$(basename "$d")"
            echo "::group::render $slug"
            crossplane render \
              "examples/${slug}/xr.yaml" \
              "${d}composition.yaml" \
              examples/functions.yaml
            echo "::endgroup::"
          done
