#
# CompositeResourceDefinition for the Hetzner Cloud VM node blueprint.
# A single Hetzner Cloud server bootstrapped through cloud-init
# user-data.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xhetznervmnodes.blueprints.plexsphere.com
spec:
  group: blueprints.plexsphere.com
  names:
    kind: XHetznerVMNode
    plural: xhetznervmnodes
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                location:
                  type: string
                  description: Hetzner Cloud datacenter location (e.g. fsn1).
                serverType:
                  type: string
                  description: Hetzner Cloud server type identifier.
                userData:
                  type: string
                  description: cloud-init user-data injected at first boot.
                cloudTags:
                  type: object
                  description: Propagation-resolved cloud-provider tags stamped by the broker at render time.
                  additionalProperties:
                    type: string
              required:
                - location
                - serverType
