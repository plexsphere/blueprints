#
# Example composite for `crossplane render` of the openstack-instance
# blueprint. Used by CI only.
apiVersion: blueprints.plexsphere.com/v1alpha1
kind: XOpenStackInstance
metadata:
  name: example-openstack-instance
spec:
  parameters:
    availabilityZone: nova
    flavorName: m1.small
    rootVolumeGb: 50
  userData: "#cloud-config\n"
  cloudTags:
    plexsphere:example: "true"
