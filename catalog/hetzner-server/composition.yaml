#
# Composition for the Hetzner Cloud server blueprint. A single
# Pipeline step renders the Hetzner server resource and injects
# cloud-init user-data.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: hetzner-server
spec:
  compositeTypeRef:
    apiVersion: blueprints.plexsphere.com/v1alpha1
    kind: XHetznerServer
  mode: Pipeline
  pipeline:
    - step: render-hetzner-server
      functionRef:
        name: function-patch-and-transform
      # DECISION: the patch-and-transform step's base managed resource is
      # the Crossplane Hetzner provider hcloud.crossplane.io/v1alpha1
      # Server. Alternative considered: leave the step input empty and let
      # a later blueprint-authoring story choose the base. REJECTED — the
      # cloud-tag patch's toFieldPath must name a concrete provider tag
      # field, which only exists once a base is pinned; the Hetzner Server
      # is the managed resource this blueprint provisions and Hetzner
      # Cloud names its tag field "labels", so the tags land on
      # spec.forProvider.labels rather than the AWS-style spec.forProvider.tags.
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: hetzner-server
            base:
              apiVersion: hcloud.crossplane.io/v1alpha1
              kind: Server
            patches:
              # Copy the broker-resolved cloud tags onto the Hetzner
              # provider label field so the materialised server carries
              # the plexsphere:-prefixed tags.
              - type: FromCompositeFieldPath
                fromFieldPath: spec.cloudTags
                toFieldPath: spec.forProvider.labels
